<!DOCTYPE html>
<html>
<head>
<title>Universal Ad Maker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="background:#0a0f2d; color:white; text-align:center; font-family:sans-serif; padding:20px">
<h1 style="color:gold">UNIVERSAL AD MAKER</h1>
<p>Image dalo + Hint likho, AI ad bana dega</p>
<form action="/create-ad" method="post" enctype="multipart/form-data">
  <input type="file" name="image" required style="padding:10px; background:white; color:black; width:90%"><br><br>
  <input type="text" name="hint" placeholder="Hint likho: Nalky racket beginners ke liye best hai" required style="width:90%; padding:12px"><br><br>
  <button type="submit" style="background:gold; padding:15px 30px; font-weight:bold; border:none; border-radius:10px; font-size:16px">PROFESSIONAL AD BANAO</button>
</form>
<p style="margin-top:20px; color:#ccc">Women Voice + Animation ke saath ad banega</p>
</body>
</html>
